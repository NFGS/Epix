name: Deploy a producción

# Despliega en Vercel tras cada push a `main` que toque código o configuración.
# - El build sigue ocurriendo en Vercel (incluye source maps a Sentry).
# - Los pushes hechos por GITHUB_TOKEN (p. ej. el keepalive) no disparan
#   workflows, así que no generan despliegues.
# - Verificación manual: Actions → «Deploy a producción» → Run workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/keepalive.txt'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel (build remoto)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
      - name: Desplegar en producción
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
