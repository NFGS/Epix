name: Keepalive (actividad mensual)

# Mantiene el repositorio «activo» con un commit mensual mínimo: GitHub pausa
# los workflows programados (p. ej. «Push cron») cuando el repositorio pasa
# 60 días sin actividad. Este workflow reinicia ese contador cada mes.
# - Corre el día 1 de cada mes a las 12:00 UTC (7:00 a. m. Colombia).
# - Verificación manual: Actions → «Keepalive (actividad mensual)» → Run workflow.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    name: Registro de actividad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
      - name: Commit mensual (marca de tiempo)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Sin cambios: nada que registrar."
          else
            git commit -m "chore(keepalive): actividad mensual para mantener los workflows programados"
            git push
          fi
